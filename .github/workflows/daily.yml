name: Daily CRE job watcher

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

# A scheduled run deploys Pages itself after it commits fresh data. Keep that
# deployment serialized with the standalone Pages workflow so two deployments
# cannot target the github-pages environment at the same time.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch feeds, rebuild history, update Issue, and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m watcher.pipeline --commit
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp index.html browse.html market.html styles.css app.js service-worker.js manifest.webmanifest icon.svg public/
          cp data/history.csv data/status.json public/data/
      - name: Validate static site inputs
        run: |
          test -s index.html
          test -s browse.html
          test -s market.html
          test -s data/history.csv
          test -s data/status.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
