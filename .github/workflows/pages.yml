name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp index.html browse.html market.html styles.css app.js service-worker.js manifest.webmanifest icon.svg public/
          cp data/history.csv data/status.json public/data/
      - name: Validate static site artifact
        run: |
          test -s public/index.html
          test -s public/browse.html
          test -s public/market.html
          test -s public/data/history.csv
          test -s public/data/status.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
